services:
  paperless-classifier:
    build:
      context: ${CLASSIFIER_DIR:?CLASSIFIER_DIR_is_required}/classifier
    restart: unless-stopped
    env_file:
      - ${CLASSIFIER_DIR:?CLASSIFIER_DIR_is_required}/.classifier.env
    volumes:
      - ${CLASSIFIER_DIR:?CLASSIFIER_DIR_is_required}/classifier/taxonomy.yaml:/app/taxonomy.yaml:ro
      - classifier_state:/state

volumes:
  classifier_state:
