rules:
  - "Classify by the document's actual purpose, not by incidental words."
  - "primary_category is the domain that best explains why the document exists."
  - "A document may receive cross-domain leaf tags, but only when each tag is materially useful."
  - "Insurance documents stay primarily under insurance even if they contain prices or payments."
  - "Medical-provider documents belong to health; health-insurer premiums and reimbursements belong to insurance."
  - "Salary and employment documents belong primarily to employment even though money is involved."
  - "Rent, leases and housing charges belong primarily to housing even though money is involved."
  - "Vehicle insurance belongs primarily to insurance and uses insurance.vehicle_insurance."
  - "Tax documents belong primarily to finance and use finance.taxes."
  - "ORP/unemployment administration belongs to administration; employer/recruiter applications belong to employment."
  - "Do not add finance.billing when a more specific domain already explains an ordinary invoice."
  - "Never classify based only on the recipient's identity."
  - "Use other only as a genuine last resort."
